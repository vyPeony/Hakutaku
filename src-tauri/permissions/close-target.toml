# Hakutaku 独自コマンド close_target の許可定義（P07-1）。
#
# SEC-012 に従い、必要になった時点で個別コマンドだけを許可する
# （src-tauri/capabilities/default.toml のコメント参照）。core:default は
# 復元しない。

[[permission]]
identifier = "allow-close-target"
description = "参照対象一覧から対象を除去することを許可する（コア側の表示集合はそのまま残る。完全なクローズは P06 結合後）。"
commands.allow = ["close_target"]
