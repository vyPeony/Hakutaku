# Hakutaku 独自コマンド list_targets の許可定義（P07-1）。
#
# SEC-012 に従い、必要になった時点で個別コマンドだけを許可する
# （src-tauri/capabilities/default.toml のコメント参照）。core:default は
# 復元しない。

[[permission]]
identifier = "allow-list-targets"
description = "開いている参照対象の一覧（アドホックな対象と設定由来のデータソースを開いたセッション）を取得することを許可する。フロントエンドへ絶対パスは渡さない（SEC-012）。"
commands.allow = ["list_targets"]
