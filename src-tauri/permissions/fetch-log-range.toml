# Hakutaku 独自コマンド fetch_log_range の許可定義（P04-1）。
#
# SEC-012 に従い、必要になった時点で個別コマンドだけを許可する
# （src-tauri/capabilities/default.toml のコメント参照）。core:default は
# 復元しない。

[[permission]]
identifier = "allow-fetch-log-range"
description = "表示集合に対して範囲（開始位置・件数・期待する世代）を指定してログ項目を取得することを許可する。"
commands.allow = ["fetch_log_range"]
