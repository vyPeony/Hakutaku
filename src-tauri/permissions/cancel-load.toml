# Hakutaku 独自コマンド cancel_load の許可定義（P07-2）。
#
# SEC-012 に従い、必要になった時点で個別コマンドだけを許可する
# （src-tauri/capabilities/default.toml のコメント参照）。core:default は
# 復元しない。

[[permission]]
identifier = "allow-cancel-load"
description = "読み込み中の対象にキャンセルを要求することを許可する。フロントエンドは対象 ID で参照する（SEC-012）。"
commands.allow = ["cancel_load"]
