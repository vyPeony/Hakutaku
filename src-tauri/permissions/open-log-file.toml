# Hakutaku 独自コマンド open_log_file の許可定義（P04-1）。
#
# SEC-012 に従い、必要になった時点で個別コマンドだけを許可する
# （src-tauri/capabilities/default.toml のコメント参照）。core:default は
# 復元しない。

[[permission]]
identifier = "allow-open-log-file"
description = "ネイティブのファイル選択ダイアログを表示し、選択されたログファイルを読み込んで表示集合として登録することを許可する。フロントエンドへ絶対パスは渡さない（SEC-012）。"
commands.allow = ["open_log_file"]
