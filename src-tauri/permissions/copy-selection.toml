# Hakutaku 独自コマンド copy_selection の許可定義（P10）。
#
# SEC-012 に従い、必要になった時点で個別コマンドだけを許可する
# （src-tauri/capabilities/default.toml のコメント参照）。core:default は
# 復元しない。

[[permission]]
identifier = "allow-copy-selection"
description = "選択範囲（開始位置・件数・期待する世代・列の組）を指定してクリップボードへコピーすることを許可する。"
commands.allow = ["copy_selection"]
