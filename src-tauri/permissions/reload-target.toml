# Hakutaku 独自コマンド reload_target の許可定義（P06-5）。
#
# SEC-012 に従い、必要になった時点で個別コマンドだけを許可する
# （src-tauri/capabilities/default.toml のコメント参照）。core:default は
# 復元しない。

[[permission]]
identifier = "allow-reload-target"
description = "利用者の明示的な指示で対象を開き直し、最新状態を反映することを許可する（LOG-028）。フロントエンドはパスを持たないため対象 ID で参照する（SEC-012）。"
commands.allow = ["reload_target"]
