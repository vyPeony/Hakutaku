# Hakutaku 独自コマンド open_config_data_source の許可定義（P07-1）。
#
# SEC-012 に従い、必要になった時点で個別コマンドだけを許可する
# （src-tauri/capabilities/default.toml のコメント参照）。core:default は
# 復元しない。

[[permission]]
identifier = "allow-open-config-data-source"
description = "設定（hakutaku.yaml の data_sources）に事前定義されたデータソースを、名前で参照して開くことを許可する。フロントエンドはパスを渡さず名前だけを渡す（SEC-012）。"
commands.allow = ["open_config_data_source"]
