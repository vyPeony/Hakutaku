# Hakutaku 独自コマンド disable_merged_view の許可定義（P09-1）。
#
# SEC-012 に従い、必要になった時点で個別コマンドだけを許可する
# （src-tauri/capabilities/default.toml のコメント参照）。core:default は
# 復元しない。

[[permission]]
identifier = "allow-disable-merged-view"
description = "時系列統合表示集合を破棄しOFFにすることを許可する（LOG-008、LOG-015）。参照対象ファイルは変更しない。"
commands.allow = ["disable_merged_view"]
